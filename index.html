<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>💌 Anonymous Flower Letter</title>
<style>
body { font-family: 'Poppins', sans-serif; background: #ffeef2; text-align:center; padding:20px;}
.box { background:white; padding:20px; margin:20px auto; width:320px; border-radius:15px; box-shadow:0 0 10px gray;}
input, select, textarea { width:90%; padding:10px; margin:10px 0; border-radius:10px; border:1px solid #ddd; font-size:16px; }
button { padding:12px 20px; background:pink; border:none; border-radius:10px; cursor:pointer; font-size:16px;}
button:hover { background:#ff6b81; }
</style>
</head>
<body>

<div class="box">
<h2>💐 Anonymous Flower Letter</h2>
<input type="text" id="sender" placeholder="Хэнээс ирж байна вэ?">
<input type="text" id="receiver" placeholder="Хэнд илгээх вэ?">
<select id="flower">
<option>🌹 Rose</option>
<option>🌸 Sakura</option>
<option>💐 Bouquet</option>
</select>
<textarea id="message" placeholder="Захиа бичнэ үү..." rows="4"></textarea>
<button onclick="sendMessage()">Send 💌</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyD_nv8K84S2FXRISpDZC5uWvL5jZDIcMI0",
  authDomain: "pulmo-aa54b.firebaseapp.com",
  projectId: "pulmo-aa54b",
  storageBucket: "pulmo-aa54b.firebasestorage.app",
  messagingSenderId: "299671389318",
  appId: "1:299671389318:web:d12817a6e385832f86bd07",
  measurementId: "G-NXLKY603X9"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function sendMessage(){
  var sender=document.getElementById("sender").value.trim();
  var receiver=document.getElementById("receiver").value.trim();
  var flower=document.getElementById("flower").value;
  var message=document.getElementById("message").value.trim();

  if(!sender || !receiver || !message) return alert("Бүх талбаруудыг бөглөнө үү!");

  db.collection("letters").add({
    sender: sender,
    receiver: receiver,
    flower: flower,
    message: message,
    time: new Date()
  });

  alert("💌 Илгээгдлээ!");
  document.getElementById("sender").value='';
  document.getElementById("receiver").value='';
  document.getElementById("message").value='';
}
</script>

</body>
</html>
